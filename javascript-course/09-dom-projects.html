<!DOCTYPE html>
<html>
  <head>
    <title>DOM Projects</title>
  </head>
  <body>
    <p>YouTube Subscribe Button</p>
    <button onclick="
      subscribe();
    " class="js-subscribe-button">
      Subscribe
    </button>

    <p>Amazon Shipping Calculator</p>
    <input placeholder="Cost of Order" class="js-text-box" onkeydown="
        handleCostKeydown(event);
    ">
    <button onclick="
      calculate();
    " class="js-calculate-button">Calculate</button>
    <p class="order-cost"></p>
    <script>
      function handleCostKeydown(event) {
          if (event.key === 'Enter') {
            calculate();
        }
      }

    function calculate() {
      const inputElement = document.querySelector('.js-text-box');
      let cost = Number(inputElement.value);

      if (cost < 40) {
        cost += 10
      }

      document.querySelector('.order-cost').innerHTML = `$${cost}`;
}

     function subscribe() {
      const buttonElement = document.querySelector('.js-subscribe-button');

      if (buttonElement.innerText === 'Subscribe') {
        buttonElement.innerHTML = 'Subscribed';
      } else {
        buttonElement.innerHTML = 'Subscribe';
      }
     }
    </script>
  </body>
</html>
