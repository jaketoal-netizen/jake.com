    <script>
      // ------------------------------------------------------------
      // Task 1: Variables and calculations

      const answerItemPrice = 12;
      const answerQuantity = 4;
      const answerTotal = answerItemPrice * answerQuantity;

      console.log(answerTotal); // 48


      // ------------------------------------------------------------
      // Task 2: Conditionals

      function answerDescribeTemperature(temperature) {
        if (temperature >= 25) {
          return 'Hot';
        } else if (temperature >= 15) {
          return 'Warm';
        } else {
          return 'Cold';
        }
      }

      console.log(answerDescribeTemperature(30)); // Hot
      console.log(answerDescribeTemperature(20)); // Warm
      console.log(answerDescribeTemperature(8));  // Cold


      // ------------------------------------------------------------
      // Task 3: Boolean logic

      function answerCanEnterEvent(age, hasTicket) {
        if (age >= 18 && hasTicket) {
          return true;
        } else {
          return false;
        }
      }

      console.log(answerCanEnterEvent(20, true));  // true
      console.log(answerCanEnterEvent(16, true));  // false
      console.log(answerCanEnterEvent(25, false)); // false


      // ------------------------------------------------------------
      // Task 4: Functions and default parameters

      function answerCalculateDiscount(price, discountPercent = 10) {
        const discount = price * (discountPercent / 100);
        return price - discount;
      }

      console.log(answerCalculateDiscount(100, 20)); // 80
      console.log(answerCalculateDiscount(50));      // 45


      // ------------------------------------------------------------
      // Task 5: Objects

      const answerProduct = {
        name: 'Headphones',
        price: 60,
        inStock: true,

        getDescription() {
          return `${this.name} cost £${this.price}`;
        }
      };

      console.log(answerProduct.name);             // Headphones
      console.log(answerProduct.inStock);          // true
      console.log(answerProduct.getDescription()); // Headphones cost £60


      // ------------------------------------------------------------
      // Task 6: Object references

      const answerOriginalProduct = {
        name: 'Keyboard',
        price: 45
      };

      const answerSecondProduct = answerOriginalProduct;
      answerSecondProduct.price = 55;

      // answerOriginalProduct.price will log: 55
      // answerSecondProduct === answerOriginalProduct will log: true

      console.log(answerOriginalProduct.price); // 55
      console.log(answerSecondProduct === answerOriginalProduct); // true


      // ------------------------------------------------------------
      // Bonus Task: Delivery cost

      function answerGetFinalTotal(orderTotal, isPremiumMember) {
        let deliveryCost;

        if (orderTotal < 20) {
          deliveryCost = 5;
        } else if (orderTotal < 50) {
          deliveryCost = 3;
        } else {
          deliveryCost = 0;
        }

        if (isPremiumMember) {
          deliveryCost = Math.max(0, deliveryCost - 2);
        }

        return orderTotal + deliveryCost;
      }

      console.log(answerGetFinalTotal(15, false)); // 20
      console.log(answerGetFinalTotal(30, true));  // 31
      console.log(answerGetFinalTotal(60, true));  // 60
