<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors</title>
    <style>
      body {
        background-color: rgb(25, 25, 25);
        font-family: Arial;
  
      }
      
      .title {
        color: white;
        font-weight: bold;
        font-size: 30px;
      }

      button {
        border: 3px solid white;
        background-color: transparent;
        color: white;
        padding: 32px;
        border-radius: 50%;
        margin-right: 10px;
      }

      button img {
        height: 48px;
      }

      button:hover {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <p class="title">Rock Paper Scissors</p>
    <button onclick="
      playGame('rock');
    ">
      <img src="rps-emojis/rock-emoji.png">
    </button>
    <button onclick="
      playGame('paper');
    ">
      <img src="rps-emojis/paper-emoji.png">
    </button>
    <button onclick="
      playGame('scissors');
    ">
      <img src="rps-emojis/scissors-emoji.png">
    </button>
    <script>
      function playGame(playerMove) {
        const computerMove = pickComputerMove();

        let result = '';

        if (playerMove === 'scissors') {
          if (computerMove === 'rock') {
          result = 'You lose.'
        } else if (computerMove === 'paper') {
          result = 'You win.';
        } else if (computerMove === 'scissors') {
          result = 'Tie.';
        }
      } else if (playerMove === 'paper') {
          if (computerMove === 'rock') {
          result = 'You win.'
        } else if (computerMove === 'paper') {
          result = 'Tie.';
        } else if (computerMove === 'scissors') {
          result = 'You lose.';
      } 
      } else if (playerMove === 'rock') {
          if (computerMove === 'rock') {
          result = 'Tie.'
        } else if (computerMove === 'paper') {
          result = 'You lose.';
        } else if (computerMove === 'scissors')
          result = 'You win.';
      }

        alert(`You picked ${playerMove}. Computer picked ${computerMove}. ${result}`);
      }

      function pickComputerMove() {
      const randomNumber = Math.random();
      
      let computerMove = '';

      if (randomNumber >= 0 && randomNumber < 1 / 3) {
        computerMove = 'rock';
      } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
        computerMove = 'paper';
      } else if (randomNumber >= 2/3 && randomNumber < 1)  {
        computerMove = 'scissors';
      }

      return computerMove;
      }
    </script>
  </body>
</html>
