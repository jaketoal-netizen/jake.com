  let price;    

  function getDeliveryCost(orderTotal, isPremiumMember) {
    if (orderTotal <= 20) {
      price = 5;
    } else if (orderTotal >= 20 && orderTotal <= 49) {
      price = 3;
    } else if (orderTotal >= 50) {
      price = 0;
    } 

    if (isPremiumMember) {
      price = price - 2;
    } 
    return('£' + price);
  }

    console.log(getDeliveryCost(15, false)); // £5
    console.log(getDeliveryCost(30, true));  // £1
    console.log(getDeliveryCost(60, false)); // £0
    console.log(getDeliveryCost(60, true));  // £0
